server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # handle React Router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}